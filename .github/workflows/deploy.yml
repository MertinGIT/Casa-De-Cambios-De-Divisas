name: Deploy Global Exchange

on:
  push:
    branches:
      - develop
    tags:
      - "*"

jobs:
  deploy-dev:
    name: Deploy Desarrollo
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=True" > .env
          fi

      - name: Dar permisos al script de desarrollo
        run: chmod +x global_exchange/deploy_desarrollo.sh

      - name: Ejecutar Deploy DEV
        working-directory: ./global_exchange
        run: ./deploy_desarrollo.sh
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

  deploy-prod:
    name: Deploy Producción (Tag)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Obtener versión del tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Mostrar versión detectada
        run: echo "Producción versión:" ${{ steps.version.outputs.version }}

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=False" > .env
          fi

      - name: Dar permisos al script de producción
        run: chmod +x global_exchange/deploy.sh

      - name: Ejecutar Deploy PROD
        working-directory: ./global_exchange
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: ./deploy.sh $VERSION