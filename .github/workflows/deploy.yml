name: Deploy Global Exchange

on:
  push:
    branches:
      - develop
    tags:
      - "*"

jobs:
  deploy-dev:
    name: Deploy Desarrollo
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Crear script robusto de desarrollo
        run: |
          cat > global_exchange/deploy_desarrollo.sh << 'EOF'
          #!/bin/bash
          set -e

          # Forzar el directorio del script
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          # Variables
          COMPOSE_FILE="docker-compose.yml"
          DOCKER_COMPOSE="/usr/local/bin/docker-compose"

          echo "🛠 Desplegando entorno de desarrollo..."
          echo "📁 Directorio: $SCRIPT_DIR"

          # Verificar que existe el archivo compose
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "❌ Error: No se encuentra $COMPOSE_FILE"
            exit 1
          fi

          # Detener y limpiar contenedores existentes
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" down 2>/dev/null || true

          # Construir y levantar servicios
          echo "🔨 Construyendo imágenes..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" build

          echo "🚀 Levantando servicios..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" up -d

          # Esperar a que la base de datos esté lista
          echo "⏳ Esperando que la base de datos inicie..."
          sleep 10

          # Ejecutar migraciones
          echo "🔄 Ejecutando migraciones..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python manage.py migrate || true

          # Cargar datos iniciales si existe el script
          echo "📥 Cargando datos iniciales..."
          if [ -f "core/scripts/default_data.py" ]; then
            $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python core/scripts/default_data.py || true
          fi

          # Ejecutar poblar.py si existe
          echo "🏦 Ejecutando poblar.py (TAUSER)..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python manage.py shell -c "exec(open('core/scripts/poblar.py').read())" || true

          echo "✅ Despliegue DEV listo en http://localhost:8000"

          # Cargar datos iniciales (idempotente)
          echo "📥 Cargando datos iniciales (idempotente)…"
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python manage.py loaddata initial_data.json || true

          echo "🎉 Despliegue completado exitosamente"
          EOF

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=True" > .env
          fi

      - name: Dar permisos al script de desarrollo
        run: chmod +x global_exchange/deploy_desarrollo.sh

      - name: Ejecutar Deploy DEV
        working-directory: ./global_exchange
        run: ./deploy_desarrollo.sh
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

  deploy-prod:
    name: Deploy Producción (Tag)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Obtener versión del tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Mostrar versión detectada
        run: echo "Producción versión:" ${{ steps.version.outputs.version }}

      - name: Crear script robusto de producción
        run: |
          cat > global_exchange/deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          # Forzar el directorio del script
          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          cd "$SCRIPT_DIR"

          # Variables
          VERSION="${1:-latest}"
          COMPOSE_FILE="docker-compose.prod.yml"
          DOCKER_COMPOSE="/usr/local/bin/docker-compose"

          echo "🚀 Desplegando entorno de PRODUCCIÓN versión: $VERSION"
          echo "📁 Directorio: $SCRIPT_DIR"

          # Verificar que existe el archivo compose
          if [ ! -f "$COMPOSE_FILE" ]; then
            echo "❌ Error: No se encuentra $COMPOSE_FILE"
            exit 1
          fi

          # Detener y limpiar contenedores existentes
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" down 2>/dev/null || true

          # Construir y levantar servicios
          echo "🔨 Construyendo imágenes para producción..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" build --build-arg VERSION="$VERSION"

          echo "🚀 Levantando servicios en producción..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" up -d

          # Esperar a que la base de datos esté lista
          echo "⏳ Esperando que la base de datos inicie..."
          sleep 15

          # Ejecutar migraciones
          echo "🔄 Ejecutando migraciones..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python manage.py migrate

          # Colectar archivos estáticos
          echo "📦 Colectando archivos estáticos..."
          $DOCKER_COMPOSE -f "$COMPOSE_FILE" exec -T web python manage.py collectstatic --noinput || true

          echo "✅ Despliegue PROD versión $VERSION completado exitosamente"
          EOF

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=False" > .env
          fi

      - name: Dar permisos al script de producción
        run: chmod +x global_exchange/deploy.sh

      - name: Ejecutar Deploy PROD
        working-directory: ./global_exchange
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: ./deploy.sh $VERSION