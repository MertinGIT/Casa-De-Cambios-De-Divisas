name: Deploy Global Exchange

on:
  push:
    branches:
      - develop
    tags:
      - "*"

jobs:
  deploy-dev:
    name: Deploy Desarrollo
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Listar archivos en global_exchange
        run: |
          echo "Contenido de global_exchange:"
          ls -la global_exchange/
          echo "Archivos docker-compose:"
          ls -la global_exchange/docker-compose*

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=True" > .env
          fi
          echo "Contenido de .env:"
          cat .env

      - name: Deploy Desarrollo
        working-directory: ./global_exchange
        run: |
          echo "🛠 Desplegando entorno de desarrollo..."
          echo "📁 Directorio actual: $(pwd)"
          echo "📄 Archivos disponibles:"
          ls -la
          
          # Detener contenedores existentes
          /usr/local/bin/docker-compose -f docker-compose.yml down 2>/dev/null || true
          
          # Construir imágenes
          echo "🔨 Construyendo imágenes..."
          /usr/local/bin/docker-compose -f docker-compose.yml build
          
          # Levantar servicios
          echo "🚀 Levantando servicios..."
          /usr/local/bin/docker-compose -f docker-compose.yml up -d
          
          # Esperar a que la base de datos esté lista
          echo "⏳ Esperando que la base de datos inicie..."
          sleep 10
          
          # Ejecutar migraciones
          echo "🔄 Ejecutando migraciones..."
          /usr/local/bin/docker-compose -f docker-compose.yml exec -T web python manage.py migrate || true
          
          # Cargar datos iniciales
          echo "📥 Cargando datos iniciales..."
          /usr/local/bin/docker-compose -f docker-compose.yml exec -T web python manage.py loaddata initial_data.json || true
          
          echo "✅ Despliegue DEV completado"
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1

      - name: Mostrar logs de contenedores
        if: failure()
        working-directory: ./global_exchange
        run: |
          echo "📋 Logs de docker-compose:"
          /usr/local/bin/docker-compose -f docker-compose.yml logs --tail=50

  deploy-prod:
    name: Deploy Producción (Tag)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      - name: Verificar Docker
        run: docker --version

      - name: Obtener versión del tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Mostrar versión detectada
        run: echo "Producción versión:" ${{ steps.version.outputs.version }}

      - name: Listar archivos en global_exchange
        run: |
          echo "Contenido de global_exchange:"
          ls -la global_exchange/
          echo "Archivos docker-compose:"
          ls -la global_exchange/docker-compose*

      - name: Crear archivo .env si no existe
        run: |
          cd global_exchange
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "DEBUG=False" > .env
          fi

      - name: Deploy Producción
        working-directory: ./global_exchange
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
        run: |
          echo "🚀 Desplegando entorno de PRODUCCIÓN versión: $VERSION"
          echo "📁 Directorio actual: $(pwd)"
          
          # Detener contenedores existentes
          /usr/local/bin/docker-compose -f docker-compose.prod.yml down 2>/dev/null || true
          
          # Construir imágenes
          echo "🔨 Construyendo imágenes para producción..."
          /usr/local/bin/docker-compose -f docker-compose.prod.yml build --build-arg VERSION="$VERSION"
          
          # Levantar servicios
          echo "🚀 Levantando servicios..."
          /usr/local/bin/docker-compose -f docker-compose.prod.yml up -d
          
          # Esperar a que la base de datos esté lista
          echo "⏳ Esperando que la base de datos inicie..."
          sleep 15
          
          # Ejecutar migraciones
          echo "🔄 Ejecutando migraciones..."
          /usr/local/bin/docker-compose -f docker-compose.prod.yml exec -T web python manage.py migrate
          
          # Colectar archivos estáticos
          echo "📦 Colectando archivos estáticos..."
          /usr/local/bin/docker-compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput || true
          
          echo "✅ Despliegue PROD versión $VERSION completado"

      - name: Mostrar logs de contenedores
        if: failure()
        working-directory: ./global_exchange
        run: |
          echo "📋 Logs de docker-compose:"
          /usr/local/bin/docker-compose -f docker-compose.prod.yml logs --tail=50