

<script>
// Después de crear la transacción exitosamente
async function generarFactura(transaccionId) {
    try {
        const response = await fetch('/facturas/generar-factura/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                transaccion_id: transaccionId
            })
        });
        
        const data = await response.json();
        
        if (data.success) {
            console.log('Factura generada data global:', data);
            console.log('Factura generada:', data.cdc);
            
            // Esperar 1 minuto y consultar estado
            setTimeout(() => {
                consultarEstadoFactura(data.factura_id);
            }, 60000);
        } else {
            console.error('Error:', data.error);
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

async function consultarEstadoFactura(facturaId) {
    try {
        const response = await fetch(`/facturas/estado/${facturaId}/`);
        const data = await response.json();
        
        if (data.success) {
            console.log('Estado:', data.estado.estado_sifen);
            if (data.estado.estado_sifen === 'Aprobado') {
                alert('¡Factura aprobada por SIFEN!');
            }
        }
    } catch (error) {
        console.error('Error:', error);
    }
}

async function enviarFacturaDesdeBoton(elemento) {
    // Obtener el transaccion_id del botón
    const transaccionId = typeof elemento === 'object' 
        ? elemento.dataset.transaccionId 
        : elemento;
    
    if (!transaccionId) {
        alert('❌ No se encontró el ID de transacción');
        return;
    }
    
    try {
        // Mostrar mensaje de carga (opcional)
        const btnTexto = document.querySelector('.btn-generar-factura span');
        const textoOriginal = btnTexto?.textContent;
        if (btnTexto) btnTexto.textContent = 'Enviando...';
        
        // Llamar al endpoint que envía la factura
        const response = await fetch('/facturas/enviar-email/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                transaccion_id: transaccionId
            })
        });
        
        const data = await response.json();
        
        // Restaurar texto del botón
        if (btnTexto) btnTexto.textContent = textoOriginal;
        
        if (data.success) {
            alert('✅ ' + data.message);
            cerrarModalDeposito(); // Si quieres cerrar el modal
        } else {
            alert('❌ ' + data.message);
        }
        
    } catch (error) {
        console.error('Error:', error);
        alert('❌ Error al enviar la factura');
    }
}

// Si no tienes esta función, agrégala
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}


</script>
