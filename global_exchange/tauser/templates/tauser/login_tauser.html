<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ATM - Tauser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .atm-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        
        .atm-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        
        .atm-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        .atm-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0 0 10px 0;
        }
        
        .atm-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }
        
        .atm-body {
            padding: 40px 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
            font-size: 14px;
        }
        
        .form-control {
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            width: 100%;
            color: white;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-back {
            background: #f3f4f6;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            color: #666;
            margin-top: 15px;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: all 0.3s;
        }
        
        .btn-back:hover {
            background: #e5e7eb;
            color: #333;
        }
        
        .localidad-info {
            background: #f0f4ff;
            border: 2px solid #667eea;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="atm-container">
        <div class="atm-header">
            <div class="atm-icon">🏧</div>
            <h1>ATM Tauser</h1>
            <p>Ingresa tus credenciales</p>
        </div>
        
        <div class="atm-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
            
            {% if localidad_nombre %}
            <div class="localidad-info">
                📍 Ubicación: {{ localidad_nombre }}
            </div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="cedula" class="form-label">👤 Cédula de Identidad</label>
                    <input type="text" 
                           class="form-control" 
                           id="cedula" 
                           name="cedula" 
                           placeholder="Ej: 12345678"
                           required
                           autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">🔒 Contraseña</label>
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           name="password" 
                           placeholder="Ingresa tu contraseña"
                           required>
                </div>
                
                <button type="submit" class="btn-login">
                    ✓ Iniciar Sesión
                </button>
            </form>
            
            <a href="{% url 'atm_seleccionar_localidad' %}" class="btn-back">
                ← Cambiar Ubicación
            </a>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
